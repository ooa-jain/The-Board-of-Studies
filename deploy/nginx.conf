# /etc/nginx/sites-available/bos.juooa.cloud
# ln -s /etc/nginx/sites-available/bos.juooa.cloud /etc/nginx/sites-enabled/
# certbot --nginx -d bos.juooa.cloud

server {
    listen 80;
    server_name bos.juooa.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bos.juooa.cloud;

    ssl_certificate     /etc/letsencrypt/live/bos.juooa.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bos.juooa.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 32M;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /var/log/nginx/bos-access.log;
    error_log  /var/log/nginx/bos-error.log;

    location /static/ {
        alias /var/www/jain-bos-portal/app/static/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass         http://127.0.0.1:8102;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
