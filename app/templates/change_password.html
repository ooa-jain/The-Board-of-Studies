{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="card" style="max-width:480px;margin:40px auto">
  <div class="card-head"><h3>Change your password</h3></div>
  <div class="card-body">
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="post">
      {% include "_csrf.html" %}
      <div class="field">
        <label for="current">Current password</label>
        <input type="password" id="current" name="current" required autofocus>
      </div>
      <div class="field">
        <label for="new">New password</label>
        <input type="password" id="new" name="new" required minlength="10">
        <span class="help">At least 10 characters.</span>
      </div>
      <div class="field">
        <label for="confirm">Confirm the new password</label>
        <input type="password" id="confirm" name="confirm" required minlength="10">
      </div>
      <button class="btn btn-block" type="submit">Change password</button>
    </form>
  </div>
</div>
{% endblock %}
