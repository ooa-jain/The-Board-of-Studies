{% extends "base.html" %}
{% block title %}{{ code }}{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;margin:60px auto">
  <div class="card-body" style="text-align:center;padding:48px 32px">
    <div style="font-family:var(--font-head);font-size:3.4rem;color:var(--sand-500);line-height:1">{{ code }}</div>
    <h2 class="mt-1">{{ message }}</h2>
    <a class="btn mt-2" href="{{ url_for('public.landing') }}">Back to the portal</a>
  </div>
</div>
{% endblock %}
