<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#091324">
  <title>Offline · BoS Academic Portal</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
           font: 16px/1.5 Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; background: #f4f6fa; color: #1f2937; }
    main { max-width: 380px; text-align: center; }
    img { width: 72px; height: 72px; }
    h1 { font-size: 1.3rem; margin: 16px 0 6px; color: #091324; }
    p { margin: 0 0 20px; color: #4b5563; }
    button { font: inherit; font-weight: 600; padding: 10px 22px; border: 0; border-radius: 8px;
             background: #091324; color: #fff; cursor: pointer; }
    @media (prefers-color-scheme: dark) {
      body { background: #12161d; color: #e5e7eb; } h1 { color: #fff; } p { color: #aab2c1; }
      button { background: #e5e7eb; color: #091324; }
    }
  </style>
</head>
<body>
  <main>
    <img src="/static/img/app-192.png" alt="">
    <h1>You are offline</h1>
    <p>The BoS Academic Portal needs an internet connection. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
